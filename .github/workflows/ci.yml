name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    # Exercise the shipped standalone mode consistently at both build time and
    # preview runtime, regardless of inherited runner configuration.
    env:
      VITE_AUTH_ENABLED: "false"
      DATABASE_URL: ""
      XAI_API_KEY: ""
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up exact Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund

      # TanStack's production build generates src/routeTree.gen.ts. Build it
      # before typechecking so newly added file routes are part of the graph.
      - name: Build production bundle and generate route tree
        run: npm run build

      - name: Enforce client entry and eager-graph budgets
        run: npm run check:client-bundle

      - name: Verify emitted server module syntax
        shell: bash
        run: |
          functions_dir=.vercel/output/functions
          if [[ ! -d "$functions_dir" ]]; then
            echo "Production build did not emit a functions directory."
            exit 1
          fi
          modules_file="${RUNNER_TEMP}/server-modules.list"
          find "$functions_dir" -type f \( -name '*.mjs' -o -name '*.js' \) -print0 > "$modules_file"
          mapfile -d '' modules < "$modules_file"
          if [[ "${#modules[@]}" -eq 0 ]]; then
            echo "Production build did not emit any server modules."
            exit 1
          fi
          for module in "${modules[@]}"; do
            if ! node --check "$module"; then
              sed -n '1,160p' "$module"
              exit 1
            fi
          done

      - name: Verify production excludes embedded-database artifacts
        shell: bash
        run: |
          functions_dir=.vercel/output/functions
          if [[ ! -d "$functions_dir" ]]; then
            echo "Production build did not emit a functions directory."
            exit 1
          fi
          if grep --recursive --line-number --binary-files=without-match \
            --extended-regexp --include='*.mjs' --include='*.js' \
            'pglite\.(data|wasm)|initdb\.wasm' "$functions_dir"; then
            echo "Production server output retained a PGLite WASM/data loader."
            exit 1
          else
            scan_status=$?
            if [[ "$scan_status" -ne 1 ]]; then
              echo "Production artifact scan failed with status $scan_status."
              exit "$scan_status"
            fi
          fi

      - name: Verify production excludes a baked preview OAuth secret
        shell: bash
        run: |
          functions_dir=.vercel/output/functions
          if grep --recursive --line-number --binary-files=without-match \
            --extended-regexp --include='*.mjs' --include='*.js' \
            '(grok_preview.{0,512}[[:xdigit:]]{64}|[[:xdigit:]]{64}.{0,512}grok_preview)' \
            "$functions_dir"; then
            echo "Production server output retained a credential-shaped preview OAuth secret."
            exit 1
          else
            scan_status=$?
            if [[ "$scan_status" -ne 1 ]]; then
              echo "Preview credential artifact scan failed with status $scan_status."
              exit "$scan_status"
            fi
          fi

      - name: Upload invalid server-module diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: invalid-server-module
          path: .vercel/output/functions/__server.func/_ssr/ssr*.mjs
          if-no-files-found: warn
          retention-days: 1

      - name: Verify generated artifacts are committed
        run: git diff --exit-code -- package-lock.json src/routeTree.gen.ts

      - name: Typecheck generated application
        run: npm run typecheck

      - name: Lint with a zero-warning budget
        run: npm run lint

      - name: Run source-owned application tests
        run: npm test

      - name: Verify platform PWA fixture in isolation
        shell: bash
        run: |
          fixture_root="${{ runner.temp }}/pwa-fixture"
          mkdir -p "$fixture_root/public"
          cp -R scripts "$fixture_root/scripts"
          cp -R server "$fixture_root/server"
          cp -R public/__grok "$fixture_root/public/__grok"
          cp vite.config.ts "$fixture_root/vite.config.ts"
          cd "$fixture_root"
          node --test scripts/grok-pwa-plugin.test.mjs

      - name: Install Chromium for production smoke test
        run: ./node_modules/.bin/playwright install --with-deps chromium

      - name: Smoke-test production preview on desktop and mobile
        shell: bash
        run: |
          sudo mkdir -p /workspace/screenshots
          sudo chown "$(id -u):$(id -g)" /workspace /workspace/screenshots
          # Runtime NODE_ENV is deliberately hostile: the compiled dev-server
          # boundary, not this mutable variable, must keep PGLite disabled.
          # Keep the browser smoke deterministic and prove the verified
          # pre-provider failure path without spending quota or sending media.
          # Pin runtime auth off as well so the preview server cannot drift from
          # the auth-off client bundle through an inherited runner variable.
          XAI_API_KEY= DATABASE_URL= VITE_AUTH_ENABLED=false NODE_ENV=development npm run preview > /workspace/screenshots/production-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT

          ready=false
          for attempt in $(seq 1 60); do
            if curl --silent --show-error --fail http://127.0.0.1:8081/ > /dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          if [[ "$ready" != "true" ]]; then
            echo "Production preview did not become healthy within 60 seconds."
            exit 1
          fi

          auth_body="${RUNNER_TEMP}/auth-session.json"
          auth_status=$(curl --silent --show-error \
            --output "$auth_body" --write-out '%{http_code}' \
            http://127.0.0.1:8081/api/auth/get-session)
          if [[ "$auth_status" != "200" ]]; then
            echo "Auth-off session probe returned HTTP $auth_status."
            sed -n '1,40p' "$auth_body"
            exit 1
          fi
          curl --silent --show-error --fail http://127.0.0.1:8081/ > /dev/null

          for route in /studio /knowledge /nerves /article/consent-frameworks /emergency; do
            curl --silent --show-error --fail "http://127.0.0.1:8081${route}" > /dev/null
          done
          emergency_html="${RUNNER_TEMP}/emergency.html"
          curl --silent --show-error --fail http://127.0.0.1:8081/emergency > "$emergency_html"
          if grep --extended-regexp 'assets/(kb|ties)-[A-Za-z0-9._-]+\.js' "$emergency_html"; then
            echo "Emergency route eagerly preloaded a knowledge-base chunk."
            exit 1
          fi

          node scripts/browser-smoke.mjs \
            http://127.0.0.1:8081/ \
            /workspace/screenshots/production-preview.png

          node scripts/camera-preflight-smoke.mjs \
            http://127.0.0.1:8081/ \
            /workspace/screenshots/camera-preflight.png

      - name: Upload production smoke evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-smoke-evidence
          path: /workspace/screenshots/
          if-no-files-found: warn
          retention-days: 7
